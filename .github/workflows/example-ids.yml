name: Example identifiers

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Only placeholder logins in tracked files
        # Docs, help text and tests use placeholder NCI-style logins
        # (two letters + four digits). Anything else must be added to the
        # allow-list deliberately.
        run: |
          set -euo pipefail
          ALLOW='^(ab1234|cd1234|cd5678|ef9012|gh3456|xy1234|cb2431)$'
          found=$(git grep -ohwE '[a-z]{2}[0-9]{4}' -- . ':!.github/workflows/example-ids.yml' \
                    | sort -u | grep -vE "$ALLOW" || true)
          if [[ -n "$found" ]]; then
            echo "::error::Non-placeholder login-like identifiers found:"
            for id in $found; do
              git grep -nw "$id" -- . ':!.github/workflows/example-ids.yml'
            done
            exit 1
          fi
          echo "OK"

      - name: Only placeholder project codes in storage paths
        # Example paths use placeholder project codes (ab12, cd34) or
        # <project>; anything shaped like a real project code is flagged.
        run: |
          set -euo pipefail
          codes=$(git grep -ohE '(/g/data|/scratch|/massdata)/[A-Za-z0-9]+|(gdata|scratch|massdata)/[a-z0-9]+\+' \
                    -- . ':!.github/workflows/example-ids.yml' \
                  | sed -E 's#^/?(g/data|scratch|massdata|gdata)/##; s#\+$##' \
                  | grep -E '^[a-z]{1,3}[0-9]{1,3}$' | sort -u | grep -vE '^(ab12|cd34)$' || true)
          if [[ -n "$codes" ]]; then
            echo "::error::Non-placeholder project codes in storage paths:"
            for c in $codes; do
              git grep -nE "(/g/data|/scratch|/massdata|gdata|scratch|massdata)/$c\b" -- . ':!.github/workflows/example-ids.yml'
            done
            exit 1
          fi
          echo "OK"
